name: EpubReaderSpike
options:
  bundleIdPrefix: com.veltrea
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: ja
  knownRegions:
    - ja
    - en
    - Base
targets:
  EpubReaderSpike:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        # foliate は下でフォルダ参照として丸ごと入れる（ES モジュールのディレクトリ構造を保持）。
        excludes:
          - "foliate/**"
      # foliate-js のホスト一式。フォルダ参照でバンドルするとサブディレクトリ構造が保たれ、
      # reader.html の `./foliate-js/view.js` 相対 import が解決できる。
      - path: Resources/foliate
        type: folder
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        # 版番号はビルド設定（下の MARKETING_VERSION / CURRENT_PROJECT_VERSION）から取る。
        # ここで指定しないと XcodeGen が既定の 1.0 / 1 を書き込み、タグやファイル名だけが
        # 新しくて中身が 1.0 のままの配布物になる（0.1.0〜0.3.0 が実際にそうなっていた）。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # VOICEVOX / AivisSpeech は http://127.0.0.1（平文）。
        # Catalyst の App Transport Security がブロックするので localhost 通信を許可する。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        # スリープタイマーの「シャットダウン」は System Events に終了を依頼する
        #（root が要る shutdown(8) と違い、正規の終了処理が走る）。初回にこの文言で許可を尋ねられる。
        NSAppleEventsUsageDescription: >-
          スリープタイマーで指定した時間が過ぎたあと、Mac をシャットダウンするために使います。
          シャットダウンを選ばない限り、この許可は使いません。
        # OS 言語に追従（ja/en）。これでシステム提供のメニュー項目(Cut/Copy等)も OS 言語で出る。
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations:
          - ja
          - en
        # Finder で .epub をダブルクリック（/「このアプリケーションで開く」）したときに
        # このアプリが開けるよう、扱えるドキュメント型として EPUB を宣言する。
        # org.idpf.epub-container はシステム定義の UTI なので、独自宣言(UTImportedTypeDeclarations)は不要。
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - org.idpf.epub-container
        # 開いた本をコピーせず元の場所のまま読む（読書位置の保存先も実パスで一意になる）。
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.veltrea.EpubReaderSpike
        SUPPORTS_MACCATALYST: "YES"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.3.1"
        CURRENT_PROJECT_VERSION: "4"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
