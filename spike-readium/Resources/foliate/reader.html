<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<!-- ローカルアプリ。自スキーム(foliate:)・blob:・data: を許可。外部は遮断。 -->
<!-- 'unsafe-eval' は DEBUG の測定オーバーレイ(evalInContent)用。外部ホストは一切許可しない。 -->
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self' foliate:; script-src 'self' foliate: 'unsafe-eval'; img-src 'self' foliate: blob: data:; media-src 'self' foliate: blob: data:; style-src 'self' foliate: 'unsafe-inline' blob:; frame-src blob: foliate:; font-src 'self' foliate: blob: data:; connect-src 'self' foliate: blob:;">
<style>
  /* 地肌はテーマ色（--page-bg）。Swift が atDocumentStart のユーザースクリプトで注入するので、
     本文 iframe が描画される前からテーマ色になる。#fff 固定にすると本を開いた瞬間に白く光る。 */
  html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: var(--page-bg, #fff); }
  foliate-view { display: block; height: 100%; width: 100%; background: var(--page-bg, #fff); }
</style>
</head>
<body>
<script type="module" src="bridge.js"></script>
</body>
</html>
