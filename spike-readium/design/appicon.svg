<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5566E6"/>
      <stop offset="0.55" stop-color="#5B43C9"/>
      <stop offset="1" stop-color="#7A3AB8"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF7EC"/>
      <stop offset="1" stop-color="#F4E7CF"/>
    </linearGradient>
    <filter id="pageShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1A1140" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 背景（iOS/macOS が角丸マスクする前提の全面） -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- ページ（縦書きの本） -->
  <g filter="url(#pageShadow)">
    <rect x="286" y="214" width="452" height="596" rx="30" fill="url(#page)"/>
  </g>
  <!-- 綴じ側のライン -->
  <rect x="700" y="214" width="6" height="596" fill="#E7D3AF" opacity="0.9"/>

  <!-- 縦書きの本文列（右→左）。右端はタイトル列（アクセント色・太め・長め） -->
  <g stroke-linecap="round">
    <!-- タイトル列 -->
    <line x1="662" y1="270" x2="662" y2="690" stroke="#FF6B45" stroke-width="30"/>
    <!-- 本文列 -->
    <line x1="596" y1="270" x2="596" y2="742" stroke="#3D4460" stroke-width="20"/>
    <line x1="540" y1="270" x2="540" y2="628" stroke="#3D4460" stroke-width="20"/>
    <line x1="484" y1="270" x2="484" y2="742" stroke="#3D4460" stroke-width="20"/>
    <line x1="428" y1="270" x2="428" y2="580" stroke="#3D4460" stroke-width="20"/>
    <line x1="372" y1="270" x2="372" y2="700" stroke="#3D4460" stroke-width="20"/>
  </g>

  <!-- 読み上げ（音波）: 右下から広がる同心アーク -->
  <g fill="none" stroke="#FFD166" stroke-linecap="round">
    <circle cx="742" cy="770" r="8" fill="#FFD166" stroke="none"/>
    <path d="M 742 726 A 44 44 0 0 1 786 770" stroke-width="18"/>
    <path d="M 742 690 A 80 80 0 0 1 822 770" stroke-width="18"/>
    <path d="M 742 654 A 116 116 0 0 1 858 770" stroke-width="18"/>
  </g>
</svg>
