<h1>第一ページ（右端）</h1>
<p>これは縦書きの本文である。文字は上から下へ、行は右から左へと流れてゆく。</p>
<p>ページをめくると、次の「第二ページ」が現れる。縦書きの本では、めくる方向は左へ進む。すなわち右から左へのページ送りである。</p>
<p>この見本は、このリーダーが日本語の縦書きと、右から左へのページ送りを正しく表示できるかを確かめるために作られた。</p>
