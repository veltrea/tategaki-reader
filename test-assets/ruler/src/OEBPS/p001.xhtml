<h1>測定用メジャー本</h1>
<p>この本は、画像の表示位置と本文の余白がどれだけずれているかを測るための見本である。</p>
<p>次のページから、四辺に〇〜一〇〇パーセントの目盛りを焼き込んだ画像が並ぶ。赤い外枠が画像の物理的な端、緑の十字が中央、四隅にTL・TR・BL・BRの記号がある。</p>
<p>リーダーで表示したスクリーンショットと目盛りを突き合わせれば、画像がどちら側へ何パーセントずれ、あるいは何パーセント切れているかをピクセル単位で読み取れる。</p>
<p>最後のページは余白測定用で、本文ボックスを水色の背景と青枠で可視化し、四辺に赤字で端の位置を記した。</p>
</body>
</html>
